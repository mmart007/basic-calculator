<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <div id="display">0</div>
            <div id="buttons">
                 <div class="num-row">
                    <button class="numbers">7</button>
                    <button class="numbers">8</button>
                    <button class="numbers">9</button>
                    <button class="operators" id="add">+</button>
                </div>
                <div class="num-row">
                    <button class="numbers">4</button>
                    <button class="numbers">5</button>
                    <button class="numbers">6</button>
                     <button class="operators" id="subtract">-</button>
                </div>
                <div class="num-row">
                    <button class="numbers">1</button>
                    <button class="numbers">2</button>
                    <button class="numbers">3</button>
                    <button class="operators" id="multiply">x</button>
                </div>
                <div class="num-row">
                    <button class="numbers">0</button>
                    <button class="numbers" id="decimal">.</button>
                    <button id="delete">Del</button>
                    <button class="operators" id="divide">/</button>
                </div>
                <div class="num-row">
                    <button id="clear">Clear</button>
                    <button id="equal">=</button>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="script.js"> </script>
</html>
